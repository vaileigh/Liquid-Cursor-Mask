<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Cursor Mask</title>
  <style>
    :root {
      color-scheme: only light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #fff;
      cursor: none;
      font-family: Helvetica, Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hint {
      position: fixed;
      left: 20px;
      bottom: 18px;
      z-index: 1;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      color: #111;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="hint">Move Cursor</div>
  <canvas id="maskCanvas" aria-label="Interactive space image mask"></canvas>
  <script src="./main.js" defer></script>
</body>
</html>
